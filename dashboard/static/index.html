<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DonutDex</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="hero">
      <div class="hero-copy">
        <div class="brand">DonutDex</div>
        <h1>DonutSMP Market Tracker</h1>
        <p>Live prices, volume, trends, and auction deals from completed sales.</p>
      </div>
      <div class="search-box">
        <label for="search">Search the market</label>
        <input id="search" type="search" autocomplete="off" placeholder="Search Diamond, Elytra, Spawner, Enchanted Book">
        <div id="search-results" class="search-results"></div>
      </div>
    </header>

    <main>
      <section class="market-pulse" id="market-pulse"></section>

      <section class="layout">
        <div class="panel main-panel">
          <div class="panel-head">
            <div>
              <h2>Market</h2>
              <div class="subtle">Most traded, highest volume, movers, and liquid items</div>
            </div>
            <div class="tabs" data-table="markets">
              <button data-sort="sales" class="active">Most Traded</button>
              <button data-sort="volume">Top Volume</button>
              <button data-sort="gainers">Gainers</button>
              <button data-sort="losers">Losers</button>
              <button data-sort="liquidity">Most Liquid</button>
            </div>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Item</th>
                  <th>Price</th>
                  <th>24h</th>
                  <th>Sales</th>
                  <th>Volume</th>
                  <th>Lowest Ask</th>
                </tr>
              </thead>
              <tbody id="markets"></tbody>
            </table>
          </div>
        </div>

        <aside class="side-stack">
          <div class="panel">
            <div class="panel-head compact">
              <h2>Potential Deals</h2>
            </div>
            <div id="opportunities" class="list"></div>
          </div>

          <div class="panel">
            <div class="panel-head compact">
              <h2>Trending</h2>
            </div>
            <div id="trending" class="list"></div>
          </div>
        </aside>

        <div class="panel chart-panel">
          <div class="panel-head">
            <div>
              <h2 id="chart-title">Select an item</h2>
              <div class="subtle" id="chart-meta"></div>
            </div>
            <div id="item-badges" class="badges"></div>
          </div>
          <canvas id="chart" height="300"></canvas>
        </div>

        <div class="panel status-panel">
          <div class="panel-head compact">
            <h2>Status</h2>
            <div class="status" id="status">Loading</div>
          </div>
          <div class="status-grid" id="status-grid"></div>
        </div>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
